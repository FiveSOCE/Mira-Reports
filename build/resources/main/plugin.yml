name: MiraReports
version: 0.1.0
main: gg.mira.reports.MiraReportsPlugin
api-version: '1.21'
author: FiveSOCE
commands:
  report:
    description: Report a player
    permission: mirareports.report
  reports:
    description: View report queue
    permission: mirareports.staff
  reportclose:
    description: Close a report
    permission: mirareports.staff
permissions:
  mirareports.report: {default: true}
  mirareports.staff: {default: op}
