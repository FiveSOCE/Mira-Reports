name: Release v0.1.0
on:
  push:
    paths:
      - '.github/workflows/release-v0.1.0.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 4f7568c344b82b0c200c98d7f8018d80747c1832
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: MiraReports v0.1.0
          target_commitish: 4f7568c344b82b0c200c98d7f8018d80747c1832
          body: Initial MiraReports release with persistent player reports, staff queue, close/resolution workflow, history and public API.
          files: build/libs/MiraReports-0.1.0.jar
